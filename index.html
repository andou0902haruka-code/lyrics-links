<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歌詞和訳リンク集</title>
<style>
  :root {
    --bg: #fdfaf6;
    --card-bg: #ffffff;
    --text: #2b2620;
    --sub: #7a7266;
    --accent: #d98c3f;
    --accent-dark: #b96f24;
    --border: #ece4d8;
    --tag-bg: #f4ead9;
    --tag-text: #8a5a1f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a17;
      --card-bg: #26231f;
      --text: #f0ebe2;
      --sub: #b3a999;
      --accent: #e6a15c;
      --accent-dark: #f0b978;
      --border: #3a352c;
      --tag-bg: #3a2e1e;
      --tag-text: #e6b370;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1a17; --card-bg: #26231f; --text: #f0ebe2; --sub: #b3a999;
    --accent: #e6a15c; --accent-dark: #f0b978; --border: #3a352c;
    --tag-bg: #3a2e1e; --tag-text: #e6b370;
  }
  :root[data-theme="light"] {
    --bg: #fdfaf6; --card-bg: #ffffff; --text: #2b2620; --sub: #7a7266;
    --accent: #d98c3f; --accent-dark: #b96f24; --border: #ece4d8;
    --tag-bg: #f4ead9; --tag-text: #8a5a1f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 24px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .subtitle { color: var(--sub); font-size: 0.85rem; }
  .controls {
    display: flex; flex-direction: column; gap: 10px;
    margin-bottom: 20px; position: sticky; top: 0;
    background: var(--bg); padding: 10px 0; z-index: 10;
  }
  #searchBox {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--card-bg);
    color: var(--text); font-size: 1rem;
  }
  #searchBox:focus { outline: 2px solid var(--accent); }
  .tag-filters {
    display: flex; flex-wrap: nowrap; gap: 6px; overflow-x: auto; min-width: 0; max-width: 100%;
    padding-bottom: 4px; scrollbar-width: thin; -webkit-overflow-scrolling: touch;
  }
  .tag-chip { flex: 0 0 auto; white-space: nowrap;
    padding: 5px 12px; border-radius: 999px; font-size: 0.78rem;
    background: var(--tag-bg); color: var(--tag-text); border: 1px solid transparent;
    cursor: pointer; user-select: none;
  }
  .tag-chip.active { background: var(--accent); color: #fff; }
  .song-list { display: flex; flex-direction: column; gap: 14px; }
  .song-card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 16px; padding: 16px 18px;
  }
  .song-title { font-size: 1.1rem; font-weight: 700; margin: 0; }
  .song-artist { color: var(--sub); font-size: 0.85rem; margin: 2px 0 10px; }
  .song-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .song-tags span {
    background: var(--tag-bg); color: var(--tag-text);
    font-size: 0.72rem; padding: 3px 10px; border-radius: 999px;
  }
  .song-links { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .song-links a {
    text-decoration: none; font-size: 0.85rem; padding: 7px 14px;
    border-radius: 10px; border: 1px solid var(--accent); color: var(--accent-dark);
  }
  .song-links a:hover { background: var(--tag-bg); }
  .song-memo {
    font-size: 0.85rem; color: var(--text); background: var(--bg);
    border-radius: 10px; padding: 8px 12px; white-space: pre-wrap;
    border: 1px dashed var(--border);
  }
  .song-memo:empty { display: none; }
  .view-toggle { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .view-btn {
    padding: 6px 14px; border-radius: 999px; font-size: 0.78rem; cursor: pointer;
    background: var(--card-bg); color: var(--sub);
    border: 1px solid var(--border); user-select: none;
  }
  .view-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .view-btn.ghost { border-style: dashed; }
  .artist-group {
    border: 1px solid var(--border); border-radius: 14px;
    background: var(--card-bg); overflow: hidden;
  }
  .artist-head {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 18px; cursor: pointer; user-select: none;
  }
  .artist-head:hover { background: var(--tag-bg); }
  .artist-name { font-weight: 700; font-size: 1rem; flex: 1; }
  .artist-count {
    font-size: 0.72rem; color: var(--tag-text); background: var(--tag-bg);
    padding: 3px 10px; border-radius: 999px;
  }
  .chevron { color: var(--sub); font-size: 0.8rem; transition: transform .15s; }
  .artist-group.open .chevron { transform: rotate(90deg); }
  .artist-body { display: none; padding: 0 12px 12px; flex-direction: column; gap: 10px; }
  .artist-group.open .artist-body { display: flex; }
  #songList.by-artist { gap: 8px; }
  .artist-body { gap: 0; padding: 0 0 6px; }
  .song-row {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 18px; border-top: 1px solid var(--border);
  }
  .song-row-title { flex: 1; min-width: 0; font-size: 0.95rem; font-weight: 600; overflow-wrap: anywhere; }
  .song-row a {
    flex: 0 0 auto; text-decoration: none; font-size: 0.75rem; padding: 5px 10px;
    border-radius: 8px; border: 1px solid var(--accent); color: var(--accent-dark);
  }
  .song-row a:hover { background: var(--tag-bg); }
  .song-row-memo { flex-basis: 100%; font-size: 0.8rem; color: var(--sub); white-space: pre-wrap; }
  .song-row.has-memo { flex-wrap: wrap; }
  .group-play {
    display: block; margin: 8px 18px 4px; text-align: center; text-decoration: none;
    font-size: 0.8rem; padding: 7px; border-radius: 10px;
    background: var(--tag-bg); color: var(--tag-text);
  }
  .empty-state { text-align: center; color: var(--sub); padding: 40px 0; }
  .count { text-align: center; color: var(--sub); font-size: 0.78rem; margin-bottom: 6px; }

  /* この曲の単語・表現 */
  .song-row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .vocab-btn {
    font: inherit; font-size: 0.72rem; padding: 3px 9px; border-radius: 999px; cursor: pointer;
    background: var(--tag-bg); color: var(--tag-text); border: 1px solid transparent;
  }
  .vocab-btn.on { background: var(--accent); color: #fff; }
  .song-links .vocab-btn { font-size: 0.85rem; padding: 7px 14px; border-radius: 10px; }
  .song-row-tools { display: flex; flex-wrap: wrap; gap: 6px; }
  .song-test {
    font: inherit; font-size: 0.72rem; padding: 3px 9px; border-radius: 999px; cursor: pointer;
    background: var(--card-bg); color: var(--accent-dark); border: 1px solid var(--accent);
  }
  .song-links .song-test { font-size: 0.85rem; padding: 7px 14px; border-radius: 10px; }
  .song-row.vocab-open { flex-wrap: wrap; }
  .vocab-panel {
    flex-basis: 100%; margin-top: 6px; border: 1px solid var(--border); border-radius: 12px;
    background: var(--bg); padding: 4px 12px 8px;
  }
  .song-card .vocab-panel { margin: 0 0 10px; }
  .vi { padding: 9px 0; border-bottom: 1px dashed var(--border); }
  .vi:last-of-type { border-bottom: none; }
  .vi-head { display: flex; align-items: center; gap: 6px; }
  .vi-en { font-weight: 700; font-size: 0.95rem; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .vi-type { flex: 0 0 auto; font-size: 0.66rem; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; }
  .vi-type.word { color: #3b7dd8; }
  .vi-type.phrase { color: #2f9a5a; }
  .vi-type.slang { color: #c4533a; }
  .vi-icon {
    flex: 0 0 auto; font: inherit; font-size: 0.8rem; width: 30px; height: 28px; cursor: pointer;
    border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text);
  }
  .vi-icon.del:hover { border-color: #c4533a; }
  .vi-ja { font-size: 0.86rem; margin-top: 3px; }
  .vi-note { font-size: 0.78rem; color: var(--sub); margin-top: 2px; }
  .vi-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding-top: 8px; font-size: 0.72rem; color: var(--sub); }
  .vi-foot button { font: inherit; font-size: 0.72rem; background: none; border: none; color: var(--accent-dark); cursor: pointer; padding: 2px 0; text-decoration: underline; }
  .vi-empty { font-size: 0.8rem; color: var(--sub); padding: 10px 0 2px; }
  .sync-link { text-align: center; margin-top: 28px; font-size: 0.75rem; color: var(--sub); }
  .sync-link button { font: inherit; background: none; border: none; color: var(--accent-dark); text-decoration: underline; cursor: pointer; }

  /* お気に入り */
  [hidden] { display: none !important; }
  .vi-icon.fav.on { background: var(--tag-bg); border-color: var(--accent); }
  .vi-icon.nb { width: auto; padding: 0 7px; font-size: 0.7rem; white-space: nowrap; color: var(--sub); }
  .vi-icon.nb.on { background: #e8f6ee; border-color: #2f9a5a; color: #2f7a4a; font-weight: 700; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); z-index: 50;
    max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 12px; font-size: 0.82rem;
    background: #2d3748; color: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.2);
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .view-btn.test { border-color: var(--accent); color: var(--accent-dark); }
  .fav-song { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px 4px; }
  .fav-song-head { font-size: 0.8rem; color: var(--sub); font-weight: 600; }
  .fav-song .vocab-panel { border: none; background: none; padding: 0; margin: 0; }
  .wide-btn {
    display: block; width: 100%; font: inherit; font-size: 0.9rem; padding: 11px; cursor: pointer;
    border-radius: 12px; border: none; background: var(--accent); color: #fff; font-weight: 700;
  }
  .wide-btn:disabled { opacity: 0.45; cursor: default; }
  .wide-btn.sub { background: var(--card-bg); color: var(--accent-dark); border: 1px solid var(--accent); font-weight: 600; }

  /* テスト */
  .t-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .t-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .t-title h2 { font-size: 1.1rem; margin: 0; }
  .t-link { font: inherit; font-size: 0.8rem; background: none; border: none; color: var(--accent-dark); text-decoration: underline; cursor: pointer; padding: 0; }
  .t-label { font-size: 0.78rem; color: var(--sub); font-weight: 600; margin-bottom: 6px; }
  .t-select { width: 100%; font: inherit; font-size: 0.9rem; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .t-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .t-chip {
    font: inherit; font-size: 0.8rem; padding: 6px 12px; border-radius: 999px; cursor: pointer;
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
  }
  .t-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .t-chip:disabled { opacity: 0.4; cursor: default; }
  .t-chip small { opacity: 0.8; }
  .t-note { font-size: 0.78rem; color: var(--sub); text-align: center; }
  .t-top { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--sub); }
  .t-top .t-fmt { flex: 1; }
  .t-bar { height: 4px; border-radius: 4px; background: var(--border); overflow: hidden; }
  .t-bar i { display: block; height: 100%; background: var(--accent); }
  .t-q { text-align: center; padding: 10px 0 4px; }
  .t-q-en { font-size: 1.4rem; font-weight: 700; overflow-wrap: anywhere; }
  .t-q-ja { font-size: 1.1rem; font-weight: 700; }
  .t-q-sub { font-size: 0.78rem; color: var(--sub); margin-top: 6px; }
  .t-listen { font: inherit; font-size: 1rem; padding: 12px 22px; border-radius: 999px; border: 1px solid var(--accent); background: var(--tag-bg); color: var(--accent-dark); cursor: pointer; }
  .t-choices { display: flex; flex-direction: column; gap: 8px; }
  .t-choice {
    font: inherit; font-size: 0.92rem; text-align: left; padding: 12px 14px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); overflow-wrap: anywhere;
  }
  .t-choice.correct { border-color: #2f9a5a; background: rgba(47,154,90,.12); }
  .t-choice.wrong { border-color: #c4533a; background: rgba(196,83,58,.12); }
  .t-choice:disabled { cursor: default; }
  .t-input { width: 100%; font: inherit; font-size: 1rem; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .t-hint { font-family: ui-monospace, Menlo, monospace; font-size: 0.95rem; letter-spacing: 1px; text-align: center; color: var(--accent-dark); }
  .t-row { display: flex; gap: 8px; }
  .t-row > * { flex: 1; }
  .t-ans { border-radius: 12px; padding: 12px 14px; border: 1px solid var(--border); }
  .t-ans.ok { border-color: #2f9a5a; }
  .t-ans.ng { border-color: #c4533a; }
  .t-ans-mark { font-weight: 700; margin-bottom: 6px; }
  .t-ans.ok .t-ans-mark { color: #2f9a5a; }
  .t-ans.ng .t-ans-mark { color: #c4533a; }
  .t-ans .vi { border: none; padding: 0; }
  .t-yours { font-size: 0.8rem; color: var(--sub); margin-top: 6px; overflow-wrap: anywhere; }
  .t-song { font-size: 0.75rem; color: var(--sub); margin-top: 6px; }
  .t-score { text-align: center; }
  .t-score b { font-size: 2rem; }
  .t-res { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px dashed var(--border); font-size: 0.86rem; }
  .t-res-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .t-res-text small { color: var(--sub); }
</style>
</head>

<div class="wrap">
  <header>
    <h1>🎵 歌詞和訳リンク集</h1>
    <div class="subtitle">洋楽の歌詞和訳サイトをまとめて、自分用メモも添えて学習するノート</div>

  <div id="listView">

    <div class="tag-filters" id="tagFilters"></div>

  <div class="count" id="countLabel"></div>
  <div class="song-list" id="songList"></div>
  <div class="empty-state" id="emptyState" style="display:none;">該当する曲がありません</div>
  </div>
  <div id="testView" hidden></div>
  <div class="sync-link">お気に入り・削除・テストの記録の端末間共有: <span id="syncLabel"></span> <button id="btnSync">合言葉を変える</button></div>
</div>

/* ---------- この曲の単語・表現（LYRIC_VOCAB は add_vocab.py が書く） ---------- */
// 削除＝非表示。キーは「曲名|歌手::英語」。合言葉があれば Firestore で端末間共有する
const LS_HIDDEN = 'lyricsLinks_hiddenVocab';
const TYPE_LABEL = { word: '単語', phrase: '表現', slang: 'スラング・口語' };
let hiddenVocab = new Set();
try { hiddenVocab = new Set(JSON.parse(localStorage.getItem(LS_HIDDEN) || '[]')); } catch (e) {}
const openVocab = new Set();

const songKey = s => s.title + '|' + s.artist;
const vocabKey = (s, it) => songKey(s) + '::' + it.en.toLowerCase();
const allVocab = s => LYRIC_VOCAB[songKey(s)] || [];
const shownVocab = s => allVocab(s).filter(it => !hiddenVocab.has(vocabKey(s, it)));

function saveHidden() {
  try { localStorage.setItem(LS_HIDDEN, JSON.stringify(Array.from(hiddenVocab))); } catch (e) {}
  vocabSyncPush();
}

// お気に入りとテストの記録。キーは削除と同じ「曲名|歌手::英語」
// favs: {key: {on, t}} ／ stats: {key: {ok, ng, last, lastOk}}。端末間は項目ごとに新しい方を採る
const LS_USER = 'lyricsLinks_vocabUser';
let U = { favs: {}, stats: {}, toVocab: {} };
try {
  const v = JSON.parse(localStorage.getItem(LS_USER) || '{}');
  U.favs = v.favs || {}; U.stats = v.stats || {}; U.toVocab = v.toVocab || {};
} catch (e) {}
let statsDirty = false;

function saveUser() {
  try { localStorage.setItem(LS_USER, JSON.stringify(U)); } catch (e) {}
}
const isFav = k => !!(U.favs[k] && U.favs[k].on);
function toggleFav(k) {
  U.favs[k] = { on: !isFav(k), t: Date.now() };
  saveUser();
  vocabSyncPush();
}
// テストの記録は毎問は送らず、30秒ごと・結果画面・画面を離れるときにまとめて送る
function record(k, correct) {
  const st = U.stats[k] || { ok: 0, ng: 0 };
  if (correct) st.ok++; else st.ng++;
  st.last = Date.now(); st.lastOk = correct;
  U.stats[k] = st;
  saveUser();
  statsDirty = true;
}

/* ---------- ＋単語ノート（英単語ノートサイトの未清書メモへ送る） ----------
   英単語ノート（vocab-notes）とこのサイトは同じ andou0902haruka-code.github.io なので localStorage が共通。
   押すと英単語ノートの未清書メモ（vocabNote_pending）に入れ、PendingInbox で受け箱
   reviewLists/{合言葉}__vocab_inbox にも送る。「清書して」で /vocab-note-add が単語カードにする
   （src:"lyrics"・srcRef:"曲名 / 歌手" → カードに「🎵 歌詞から」）。
   送ったかどうかは U.toVocab {key:{on,t}}（__lyrics_vocab で端末間共有）。 */
const VN_PENDING = 'vocabNote_pending';
const normEn = x => String(x || '').trim().toLowerCase().replace(/\s+/g, ' ');
function vnPending() {
  try { const v = JSON.parse(localStorage.getItem(VN_PENDING) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; }
}
function vnSetPending(list) {
  try { localStorage.setItem(VN_PENDING, JSON.stringify(list)); } catch (e) {}
  if (window.PendingInbox) window.PendingInbox.push('vocab_inbox', list);
}
const isSentToVocab = k => !!(U.toVocab[k] && U.toVocab[k].on);
function vnItem(s, it, k) {
  return {
    id: Date.now(), word: it.en, memo: '', rough: it.ja, savedAt: new Date().toISOString(),
    src: 'lyrics', srcRef: s.title + ' / ' + s.artist, hint: it.note || '', lyricKey: k
  };
}
// 戻り値: 'added' | 'already'（未清書メモに同じ英語がもうある）| 'removed' | 'elsewhere'（この端末には無い）
function toggleToVocab(s, it) {
  const k = vocabKey(s, it);
  let list = vnPending();
  let res;
  if (isSentToVocab(k)) {
    const n = list.length;
    list = list.filter(p => p.lyricKey !== k);
    res = list.length < n ? 'removed' : 'elsewhere';
    vnSetPending(list);
    U.toVocab[k] = { on: false, t: Date.now() };
  } else {
    const dup = list.some(p => p.lyricKey === k || normEn(p.word) === normEn(it.en));
    if (!dup) list.unshift(vnItem(s, it, k));
    res = dup ? 'already' : 'added';
    vnSetPending(list);
    U.toVocab[k] = { on: true, t: Date.now() };
  }
  saveUser();
  vocabSyncPush();
  return res;
}

// 音声は add_vocab.py が edge-tts（en-US-AndrewNeural・英単語ノートと同じ声）で作った audio_vocab/<id>.mp3。
// iOSで2回目以降も鳴るように audio 要素は1つを使い回し、src だけ差し替える
const vocabAudio = new Audio();
vocabAudio.preload = 'none';

function speakTTS(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/~/g, ' ').replace(/ \/ /g, ', '));
  u.lang = 'en-US'; u.rate = 0.9;
  speechSynthesis.speak(u);
}

function speak(it) {
  if (!it.id) return speakTTS(it.en);
  vocabAudio.pause();
  vocabAudio.onerror = () => speakTTS(it.en);  // mp3 が無い・読めないときだけ端末の読み上げ
  vocabAudio.src = 'audio_vocab/' + it.id + '.mp3';
  const p = vocabAudio.play();
  if (p && p.catch) p.catch(e => { if (e.name !== 'AbortError') speakTTS(it.en); });
}

function loadScript(src) {

    const el = document.createElement('script');

    document.head.appendChild(el);

async function initVocabSync() {
  const id = syncId();
  if (!id) return;
  try {
    const FB = 'https://www.gstatic.com/firebasejs/10.14.1/';
    if (!window.firebase) {
      await loadScript(FB + 'firebase-app-compat.js');
      await loadScript(FB + 'firebase-firestore-compat.js');
    }
    if (!firebase.apps.length) firebase.initializeApp(VOCAB_SYNC_CONFIG);
    const doc = firebase.firestore().collection('reviewLists').doc(id + '__lyrics_vocab');
    const snap = await Promise.race([
      doc.get(),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 4000))
    ]);
    _vocabSyncDoc = doc;
    const data = snap.exists ? snap.data() : {};
    if (Array.isArray(data.hidden)) {
      hiddenVocab = new Set(data.hidden);
      try { localStorage.setItem(LS_HIDDEN, JSON.stringify(Array.from(hiddenVocab))); } catch (e) {}
    }
    // お気に入りは t、記録は last が新しい方を項目ごとに採る（丸ごと上書きしない）
    let localNewer = !Array.isArray(data.hidden) && hiddenVocab.size > 0;
    const mergeBy = (mine, theirs, f) => {
      Object.entries(theirs || {}).forEach(([k, v]) => {
        if (!mine[k] || (v[f] || 0) > (mine[k][f] || 0)) mine[k] = v;
      });
      Object.entries(mine).forEach(([k, v]) => {
        if (!(theirs || {})[k] || (v[f] || 0) > (theirs[k][f] || 0)) localNewer = true;
      });
    };
    mergeBy(U.favs, data.favs, 't');
    mergeBy(U.stats, data.stats, 'last');
    mergeBy(U.toVocab, data.toVocab, 't');
    saveUser();
    if (listView.hidden) { if (!run) renderTestSetup(); } else { renderViewToggle(); renderSongs(); }
    if (localNewer) vocabSyncPush();
  } catch (e) {
    console.warn('単語・表現の削除の同期に失敗しました（この端末の記録だけで動きます）', e);
  }
}

function vocabSyncPush() {
  if (!_vocabSyncDoc) return;
  statsDirty = false;
  _vocabSyncDoc.set({
    hidden: Array.from(hiddenVocab), favs: U.favs, stats: U.stats, toVocab: U.toVocab,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true }).catch(e => { statsDirty = true; console.warn('記録の送信に失敗しました', e); });
}

  if (viewMode === 'fav') {
    listEl.innerHTML = '';

    .replace(/&/g, '&amp;')

}

}

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function scopeEntries(scope) {
  const all = vocabEntries();
  if (scope === 'fav') return all.filter(e => isFav(e.key));
  if (scope.startsWith('artist:')) return all.filter(e => e.s.artist === scope.slice(7));
  if (scope.startsWith('song:')) return all.filter(e => songKey(e.s) === scope.slice(5));
  return all;
}

const solvedCount = k => (U.stats[k] ? U.stats[k].ok + U.stats[k].ng : 0);

function filterEntries(list, f) {
  if (f === 'new') return list.filter(e => !U.stats[e.key]);
  if (f === 'wrong') return list.filter(e => U.stats[e.key] && U.stats[e.key].lastOk === false);
  return list;
}

function pickQuestions() {
  let list = shuffle(filterEntries(scopeEntries(T.scope), T.filter));
  if (T.filter === 'few') list.sort((a, b) => solvedCount(a.key) - solvedCount(b.key));  // 同じ回数どうしはランダムのまま
  return T.count ? list.slice(0, T.count) : list;
}

function scopeOptions() {
  const all = vocabEntries();
  const opts = [{ v: 'all', label: `すべての曲（${all.length}）` },
    { v: 'fav', label: `⭐ お気に入り（${all.filter(e => isFav(e.key)).length}）` }];
  const groups = groupByArtist(SONGS.filter(s => shownVocab(s).length));
  groups.forEach(([artist]) => opts.push({ v: 'artist:' + artist, label: `🎤 ${artist}（${scopeEntries('artist:' + artist).length}）` }));
  const songs = groups.map(([artist, songs]) => ({ artist, songs: songs.map(s => ({ v: 'song:' + songKey(s), label: `🎵 ${s.title}（${shownVocab(s).length}）` })) }));
  return { opts, songs };
}

// 一覧にもどったとき、テストを始めた位置にスクロールを戻す
let listScrollY = 0;
function openTestView() {
  if (!listView.hidden) listScrollY = window.scrollY || 0;
  listView.hidden = true;
  testView.hidden = false;
}

function showTest(scope) {
  if (scope) { T.scope = scope; saveTCfg(); }
  run = null;
  openTestView();
  renderTestSetup();
  window.scrollTo(0, 0);
}

// 曲の行の「🎧 聞いてテスト」: 設定画面を出さず、その曲の全項目を「聞いて意味を選ぶ」だけで出す（テストの設定 T は変えない）
function startSongTest(s) {
  const entries = scopeEntries('song:' + songKey(s));
  if (!entries.length) return;
  openTestView();
  startRun(shuffle(entries), { fmt: 'listen', song: s });
  window.scrollTo(0, 0);
}

function showList() {
  flushSync();
  run = null;
  testView.hidden = true;
  listView.hidden = false;
  renderViewToggle();
  renderSongs();
  window.scrollTo(0, listScrollY);
}

function renderTestSetup() {
  const { opts, songs } = scopeOptions();
  const values = opts.map(o => o.v).concat(...songs.map(g => g.songs.map(o => o.v)));
  if (!values.includes(T.scope)) T.scope = 'all';
  const base = scopeEntries(T.scope);
  const n = { all: base.length, new: filterEntries(base, 'new').length, wrong: filterEntries(base, 'wrong').length, few: base.length };
  const total = T.count ? Math.min(T.count, n[T.filter]) : n[T.filter];
  const opt = o => `<option value="${escapeHtml(o.v)}"${o.v === T.scope ? ' selected' : ''}>${escapeHtml(o.label)}</option>`;
  const chips = (k, table, fmt) => Object.keys(table).map(v =>
    `<button class="t-chip${String(T[k]) === v ? ' active' : ''}" data-k="${k}" data-v="${v}"${fmt && fmt(v) === 0 ? ' disabled' : ''}>${table[v]}${fmt ? ` <small>${fmt(v)}</small>` : ''}</button>`).join('');
  const countTable = Object.fromEntries(COUNTS.map(c => [String(c), c ? `${c}問` : 'ぜんぶ']));
  const empty = { new: '未解答の問題はもうありません', wrong: '前回まちがえた問題はありません', all: 'この範囲には問題がありません', few: 'この範囲には問題がありません' };
  testView.innerHTML = `
    <div class="t-card">
      <div class="t-title"><h2>✍️ 単語・表現テスト</h2><button class="t-link" id="tBack">← 一覧にもどる</button></div>
      <div><div class="t-label">範囲</div>
        <select class="t-select" id="tScope">${opts.map(opt).join('')}
          ${songs.map(g => `<optgroup label="${escapeHtml(g.artist)} の曲ごと">${g.songs.map(opt).join('')}</optgroup>`).join('')}
        </select></div>
      <div><div class="t-label">出題</div><div class="t-chips">${chips('filter', FILTERS, v => n[v])}</div></div>
      <div><div class="t-label">形式</div><div class="t-chips">${chips('format', FORMATS)}</div></div>
      <div><div class="t-label">問題数</div><div class="t-chips">${chips('count', countTable)}</div></div>
      <button class="wide-btn" id="tStart"${total ? '' : ' disabled'}>${total ? `▶ ${total}問はじめる` : empty[T.filter]}</button>
      <div class="t-note">答えると英語が流れます。解いた結果は「未解答」「前回まちがえた」の絞り込みに使われます</div>
    </div>`;
  testView.querySelector('#tBack').onclick = showList;
  testView.querySelector('#tScope').onchange = e => { T.scope = e.target.value; saveTCfg(); renderTestSetup(); };
  testView.querySelectorAll('.t-chip').forEach(b => b.onclick = () => {
    T[b.dataset.k] = b.dataset.k === 'count' ? Number(b.dataset.v) : b.dataset.v;
    saveTCfg();
    renderTestSetup();
  });
  testView.querySelector('#tStart').onclick = () => startRun(pickQuestions());
}

// opts = { fmt: 形式を固定, song: 曲ごとのテストの曲 }（曲ごとのテストは設定 T を使わない）
function startRun(entries, opts = {}) {
  const fmts = ['meaning', 'english', 'listen', 'write'];
  const fmtOf = () => opts.fmt || (T.format === 'mix' ? fmts[Math.floor(Math.random() * fmts.length)] : T.format);
  run = { qs: entries.map(e => ({ ...e, fmt: fmtOf() })), i: 0, results: [], opts, song: opts.song || null };
  renderQuestion();
}

// 4択の選択肢。同じ種類（単語/表現/スラング）からなるべく選ぶ。
// 曲ごとのテストでは、まずその曲の中から選ぶ（足りないときだけ他の曲から）
function choicesFor(q, field) {
  const pool = vocabEntries().filter(e => e.key !== q.key);
  const sameType = list => shuffle(list.filter(e => e.it.type === q.it.type)).concat(shuffle(list.filter(e => e.it.type !== q.it.type)));
  const inSong = run && run.song ? pool.filter(e => e.s === run.song) : [];
  const order = run && run.song ? sameType(inSong).concat(sameType(pool.filter(e => e.s !== run.song))) : sameType(pool);
  const seen = new Set([q.it[field]]);
  const picks = [];
  for (const e of order) {
    if (picks.length >= 3) break;
    if (!seen.has(e.it[field])) { seen.add(e.it[field]); picks.push(e.it[field]); }
  }
  return shuffle([q.it[field], ...picks]);
}

const normAns = t => t.toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
function writeMatches(given, en) {
  const g = normAns(given);
  return !!g && [en, ...en.split(' / ')].some(x => normAns(x) === g);
}
// ヒント: 各語の1文字目だけ見せる（bite one's tongue → b___ o__'s t_____）
const hintOf = en => en.split(' ').map(w => w.replace(/[A-Za-z]/g, (c, i) => (i === w.search(/[A-Za-z]/) ? c : '_'))).join(' ');

function renderQuestion() {
  const q = run.qs[run.i];
  run.answered = false;
  const field = q.fmt === 'english' ? 'en' : 'ja';
  let prompt;
  if (q.fmt === 'meaning') prompt = `<div class="t-q-en">${escapeHtml(q.it.en)}</div><div class="t-q-sub">意味はどれ？</div>`;
  else if (q.fmt === 'english') prompt = `<div class="t-q-ja">${escapeHtml(q.it.ja)}</div><div class="t-q-sub">英語はどれ？</div>`;
  else if (q.fmt === 'listen') prompt = `<button class="t-listen" id="tListen">🔊 もう一度聞く</button><div class="t-q-sub">聞こえた表現の意味はどれ？</div>`;
  else prompt = `<div class="t-q-ja">${escapeHtml(q.it.ja)}</div><div class="t-q-sub">英語で書くと？（${TYPE_LABEL[q.it.type] || '表現'}）</div>`;
  const body = q.fmt === 'write'
    ? `<input class="t-input" id="tInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="英語で入力（空欄でも答え合わせできます）">
       <div class="t-hint" id="tHint" hidden>${escapeHtml(hintOf(q.it.en))}</div>
       <div class="t-row"><button class="wide-btn sub" id="tHintBtn">ヒント</button><button class="wide-btn" id="tCheck">答え合わせ</button></div>`
    : `<div class="t-choices">${choicesFor(q, field).map(c => `<button class="t-choice">${escapeHtml(c)}</button>`).join('')}</div>`;
  testView.innerHTML = `
    <div class="t-card">
      <div class="t-top"><span>${run.i + 1} / ${run.qs.length}</span><span class="t-fmt">${run.song ? `🎵 ${escapeHtml(run.song.title)} ・ ` : ''}${FORMATS[q.fmt]}</span><button class="t-link" id="tQuit">✕ やめる</button></div>
      <div class="t-bar"><i style="width:${run.i / run.qs.length * 100}%"></i></div>
      <div class="t-q">${prompt}</div>
      ${body}
      <div id="tFeedback"></div>
    </div>`;
  testView.querySelector('#tQuit').onclick = quitRun;
  if (q.fmt === 'listen') {
    testView.querySelector('#tListen').onclick = () => speak(q.it);
    speak(q.it);
  }
  if (q.fmt === 'write') {
    const input = testView.querySelector('#tInput');
    testView.querySelector('#tHintBtn').onclick = () => { testView.querySelector('#tHint').hidden = false; };
    const check = () => {
      if (run.answered) return;
      if (writeMatches(input.value, q.it.en)) return answer(true, input.value);
      revealForSelfJudge(q, input.value);
    };
    testView.querySelector('#tCheck').onclick = check;
    input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) check(); });
    input.focus();
  } else {
    testView.querySelectorAll('.t-choice').forEach(b => b.onclick = () => {
      if (run.answered) return;
      const correct = b.textContent === q.it[field];
      testView.querySelectorAll('.t-choice').forEach(x => {
        x.disabled = true;
        if (x.textContent === q.it[field]) x.classList.add('correct');
      });
      if (!correct) b.classList.add('wrong');
      answer(correct, b.textContent);
    });
  }
}

function answerBox(q, cls, mark, given) {
  const box = document.createElement('div');
  box.className = 't-ans ' + cls;
  box.innerHTML = `<div class="t-ans-mark">${mark}</div>`;
  box.appendChild(vocabItemEl(q.s, q.it, { del: false }));
  box.insertAdjacentHTML('beforeend',
    (given !== undefined ? `<div class="t-yours">あなたの答え: ${given.trim() ? escapeHtml(given) : '（空欄）'}</div>` : '')
    + `<div class="t-song">🎵 ${escapeHtml(q.s.title)} — ${escapeHtml(q.s.artist)}</div>`);
  return box;
}

// 書く形式で完全一致しなかったとき: 答えを見せて、自分で ○/× を付ける
function revealForSelfJudge(q, given) {
  run.answered = true;
  testView.querySelector('#tInput').disabled = true;
  testView.querySelector('.t-row').hidden = true;
  const fb = testView.querySelector('#tFeedback');
  fb.innerHTML = '';
  fb.appendChild(answerBox(q, '', '答え（言い方の違いだけなら ○ にしてOK）', given));
  fb.insertAdjacentHTML('beforeend', '<div class="t-row" style="margin-top:10px"><button class="wide-btn sub" id="tNg">× まちがい</button><button class="wide-btn" id="tOk">○ 合ってた</button></div>');
  fb.querySelector('#tOk').onclick = () => { run.answered = false; answer(true, given); };
  fb.querySelector('#tNg').onclick = () => { run.answered = false; answer(false, given); };
  speak(q.it);
}

function answer(correct, given) {
  if (run.answered && run.results.length > run.i) return;
  run.answered = true;
  const q = run.qs[run.i];
  record(q.key, correct);
  run.results.push({ q, correct });
  const fb = testView.querySelector('#tFeedback');
  fb.innerHTML = '';
  if (q.fmt === 'write') {
    testView.querySelector('#tInput').disabled = true;
    const row = testView.querySelector('.t-row');
    if (row) row.hidden = true;
  }
  fb.appendChild(answerBox(q, correct ? 'ok' : 'ng', correct ? '✅ 正解' : '❌ ざんねん', q.fmt === 'write' ? given : undefined));
  const last = run.i === run.qs.length - 1;
  fb.insertAdjacentHTML('beforeend', `<button class="wide-btn" id="tNext" style="margin-top:10px">${last ? '結果を見る' : '次へ ▶'}</button>`);
  fb.querySelector('#tNext').onclick = () => {
    if (last) return renderResults();
    run.i++;
    renderQuestion();
    window.scrollTo(0, 0);
  };
  if (q.fmt !== 'write' || correct) speak(q.it);
}

function quitRun() {
  if (!run.results.length) return run.song ? showList() : renderTestSetup();
  run.quit = true;
  renderResults();
}

function renderResults() {
  flushSync();
  const res = run.results;
  const ok = res.filter(r => r.correct).length;
  const wrong = res.filter(r => !r.correct);
  testView.innerHTML = `
    <div class="t-card">
      <div class="t-title"><h2>結果</h2><button class="t-link" id="tBack">← 一覧にもどる</button></div>
      <div class="t-score">${run.song ? `<div class="t-note">🎵 ${escapeHtml(run.song.title)} — ${escapeHtml(run.song.artist)}（聞いて意味を選ぶ）</div>` : ''}<b>${ok}</b> / ${res.length} 問正解${run.quit ? `<div class="t-note">途中でやめました（${res.length}問ぶんは記録ずみ）</div>` : ''}</div>
      ${wrong.length ? `<button class="wide-btn" id="tRetry">❌ まちがえた${wrong.length}問をもう一度</button>` : ''}
      <button class="wide-btn sub" id="tAgain">${run.song ? '🔁 この曲をもう一度' : '設定にもどる'}</button>
      <div id="tList"></div>
    </div>`;
  const list = testView.querySelector('#tList');
  res.forEach(r => {
    const row = document.createElement('div');
    row.className = 't-res';
    row.innerHTML = `<span>${r.correct ? '✅' : '❌'}</span>
      <span class="t-res-text"><b>${escapeHtml(r.q.it.en)}</b> ${escapeHtml(r.q.it.ja)}<br><small>🎵 ${escapeHtml(r.q.s.title)}</small></span>
      <button class="vi-icon" title="読み上げ">🔊</button>
      <button class="vi-icon fav${isFav(r.q.key) ? ' on' : ''}" title="お気に入り">${isFav(r.q.key) ? '⭐' : '☆'}</button>`;
    const [sp, fv] = row.querySelectorAll('button');
    sp.onclick = () => speak(r.q.it);
    fv.onclick = () => {
      toggleFav(r.q.key);
      fv.classList.toggle('on', isFav(r.q.key));
      fv.textContent = isFav(r.q.key) ? '⭐' : '☆';
    };
    list.appendChild(row);
  });
  testView.querySelector('#tBack').onclick = showList;
  const song = run.song, opts = run.opts;
  testView.querySelector('#tAgain').onclick = () => {
    if (song) return startSongTest(song);
    run = null; renderTestSetup();
  };
  const retry = testView.querySelector('#tRetry');
  if (retry) retry.onclick = () => startRun(shuffle(wrong.map(r => r.q)), opts);
  window.scrollTo(0, 0);
}

btnArtist.onclick = () => setViewMode('artist');
btnFlat.onclick = () => setViewMode('flat');
btnFav.onclick = () => setViewMode('fav');
btnTest.onclick = () => showTest();
btnOpenAll.onclick = () => {
  groupByArtist(filteredSongs()).forEach(([artist]) => openArtists.add(artist));
  saveOpen();
  renderSongs();
};
btnCloseAll.onclick = () => {
  openArtists.clear();
  saveOpen();
  renderSongs();
};

searchBox.addEventListener('input', renderSongs);
renderTagFilters();
renderViewToggle();
renderSongs();
renderSyncLabel();
initVocabSync();

/* 未清書メモの受け箱（表現メモ・英単語ノート共通）。正本は .claude/skills_assets/auto-polish/inbox.js → inject.py で配る。
   setPending() のたびに PendingInbox.push(名前, 一覧) を呼ぶと、この端末の未清書メモを丸ごと
   reviewLists/{合言葉}__<名前> の dev_<端末ID> に書く（端末ごとに別の欄なので、iPhoneとPCで消し合わない）。
   Mac の週1回の自動清書（weekly_polish.py）がこれを読み、清書ずみのものは次に開いたとき各端末の一覧から消える。
   合言葉が無い端末・fetch が無い環境（テストのvm）では何もしない。送れなかったときは次に開いたとき送り直す。 */
(function (G) {
  if (G.PendingInbox) return;
  var KEY = 'AIzaSyASWojYpZ3KJBYG9V30Y4BmplUFORYOelw';
  var BASE = 'https://firestore.googleapis.com/v1/projects/ai-english-review/databases/(default)/documents/reviewLists/';
  var timers = {};
  function ls(k, v) {
    try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {}
    return null;
  }
  function sid() { var v = ls('aien_sync_id'); return (v && v !== '__none__') ? v : null; }
  function dev() {
    var v = ls('aien_dev_id');
    if (!v) { v = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); ls('aien_dev_id', v); }
    return v;
  }
  function push(name, list) {
    if (typeof fetch !== 'function') return;
    var id = sid();
    if (!id) return;
    var json = JSON.stringify(list || []);
    var sentKey = 'inbox_sent_' + name, mark = id + '|' + json;
    if (ls(sentKey) === mark) return;   /* 送った中身と同じなら送らない */
    clearTimeout(timers[name]);
    timers[name] = setTimeout(function () {
      var d = dev(), f = 'dev_' + d, a = 'at_' + d, body = { fields: {} };
      body.fields[f] = { stringValue: json };
      body.fields[a] = { timestampValue: new Date().toISOString() };
      fetch(BASE + encodeURIComponent(id + '__' + name) + '?updateMask.fieldPaths=' + f
        + '&updateMask.fieldPaths=' + a + '&key=' + KEY, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      }).then(function (r) { if (r.ok) ls(sentKey, mark); }).catch(function () {});
    }, 800);
  }
  G.PendingInbox = { push: push };
})(typeof window !== 'undefined' ? window : this);
