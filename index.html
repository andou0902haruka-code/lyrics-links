<style>
  :root {
    --bg: #fdfaf6;
    --card-bg: #ffffff;
    --text: #2b2620;
    --sub: #7a7266;
    --accent: #d98c3f;
    --accent-dark: #b96f24;
    --border: #ece4d8;
    --tag-bg: #f4ead9;
    --tag-text: #8a5a1f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a17;
      --card-bg: #26231f;
      --text: #f0ebe2;
      --sub: #b3a999;
      --accent: #e6a15c;
      --accent-dark: #f0b978;
      --border: #3a352c;
      --tag-bg: #3a2e1e;
      --tag-text: #e6b370;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1a17; --card-bg: #26231f; --text: #f0ebe2; --sub: #b3a999;
    --accent: #e6a15c; --accent-dark: #f0b978; --border: #3a352c;
    --tag-bg: #3a2e1e; --tag-text: #e6b370;
  }
  :root[data-theme="light"] {
    --bg: #fdfaf6; --card-bg: #ffffff; --text: #2b2620; --sub: #7a7266;
    --accent: #d98c3f; --accent-dark: #b96f24; --border: #ece4d8;
    --tag-bg: #f4ead9; --tag-text: #8a5a1f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 24px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .subtitle { color: var(--sub); font-size: 0.85rem; }
  .controls {
    display: flex; flex-direction: column; gap: 10px;
    margin-bottom: 20px; position: sticky; top: 0;
    background: var(--bg); padding: 10px 0; z-index: 10;
  }
  #searchBox {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--card-bg);
    color: var(--text); font-size: 1rem;
  }
  #searchBox:focus { outline: 2px solid var(--accent); }
  .tag-filters {
    display: flex; flex-wrap: nowrap; gap: 6px; overflow-x: auto; min-width: 0; max-width: 100%;
    padding-bottom: 4px; scrollbar-width: thin; -webkit-overflow-scrolling: touch;
  }
  .tag-chip { flex: 0 0 auto; white-space: nowrap;
    padding: 5px 12px; border-radius: 999px; font-size: 0.78rem;
    background: var(--tag-bg); color: var(--tag-text); border: 1px solid transparent;
    cursor: pointer; user-select: none;
  }
  .tag-chip.active { background: var(--accent); color: #fff; }
  .song-list { display: flex; flex-direction: column; gap: 14px; }
  .song-card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 16px; padding: 16px 18px;
  }
  .song-title { font-size: 1.1rem; font-weight: 700; margin: 0; }
  .song-artist { color: var(--sub); font-size: 0.85rem; margin: 2px 0 10px; }
  .song-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .song-tags span {
    background: var(--tag-bg); color: var(--tag-text);
    font-size: 0.72rem; padding: 3px 10px; border-radius: 999px;
  }
  .song-links { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .song-links a {
    text-decoration: none; font-size: 0.85rem; padding: 7px 14px;
    border-radius: 10px; border: 1px solid var(--accent); color: var(--accent-dark);
  }
  .song-links a:hover { background: var(--tag-bg); }
  .song-memo {
    font-size: 0.85rem; color: var(--text); background: var(--bg);
    border-radius: 10px; padding: 8px 12px; white-space: pre-wrap;
    border: 1px dashed var(--border);
  }
  .song-memo:empty { display: none; }
  .view-toggle { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .view-btn {
    padding: 6px 14px; border-radius: 999px; font-size: 0.78rem; cursor: pointer;
    background: var(--card-bg); color: var(--sub);
    border: 1px solid var(--border); user-select: none;
  }
  .view-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .view-btn.ghost { border-style: dashed; }
  .artist-group {
    border: 1px solid var(--border); border-radius: 14px;
    background: var(--card-bg); overflow: hidden;
  }
  .artist-head {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 18px; cursor: pointer; user-select: none;
  }
  .artist-head:hover { background: var(--tag-bg); }
  .artist-name { font-weight: 700; font-size: 1rem; flex: 1; }
  .artist-count {
    font-size: 0.72rem; color: var(--tag-text); background: var(--tag-bg);
    padding: 3px 10px; border-radius: 999px;
  }
  .chevron { color: var(--sub); font-size: 0.8rem; transition: transform .15s; }
  .artist-group.open .chevron { transform: rotate(90deg); }
  .artist-body { display: none; padding: 0 12px 12px; flex-direction: column; gap: 10px; }
  .artist-group.open .artist-body { display: flex; }
  #songList.by-artist { gap: 8px; }
  .artist-body { gap: 0; padding: 0 0 6px; }
  .song-row {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 18px; border-top: 1px solid var(--border);
  }
  .song-row-title { flex: 1; min-width: 0; font-size: 0.95rem; font-weight: 600; overflow-wrap: anywhere; }
  .song-row a {
    flex: 0 0 auto; text-decoration: none; font-size: 0.75rem; padding: 5px 10px;
    border-radius: 8px; border: 1px solid var(--accent); color: var(--accent-dark);
  }
  .song-row a:hover { background: var(--tag-bg); }
  .song-row-memo { flex-basis: 100%; font-size: 0.8rem; color: var(--sub); white-space: pre-wrap; }
  .song-row.has-memo { flex-wrap: wrap; }
  .group-play {
    display: block; margin: 8px 18px 4px; text-align: center; text-decoration: none;
    font-size: 0.8rem; padding: 7px; border-radius: 10px;
    background: var(--tag-bg); color: var(--tag-text);
  }
  .empty-state { text-align: center; color: var(--sub); padding: 40px 0; }
  .count { text-align: center; color: var(--sub); font-size: 0.78rem; margin-bottom: 6px; }

  /* この曲の単語・表現 */
  .song-row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .vocab-btn {
    font: inherit; font-size: 0.72rem; padding: 3px 9px; border-radius: 999px; cursor: pointer;
    background: var(--tag-bg); color: var(--tag-text); border: 1px solid transparent;
  }
  .vocab-btn.on { background: var(--accent); color: #fff; }
  .song-links .vocab-btn { font-size: 0.85rem; padding: 7px 14px; border-radius: 10px; }
  .song-row.vocab-open { flex-wrap: wrap; }
  .vocab-panel {
    flex-basis: 100%; margin-top: 6px; border: 1px solid var(--border); border-radius: 12px;
    background: var(--bg); padding: 4px 12px 8px;
  }
  .song-card .vocab-panel { margin: 0 0 10px; }
  .vi { padding: 9px 0; border-bottom: 1px dashed var(--border); }
  .vi:last-of-type { border-bottom: none; }
  .vi-head { display: flex; align-items: center; gap: 6px; }
  .vi-en { font-weight: 700; font-size: 0.95rem; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .vi-type { flex: 0 0 auto; font-size: 0.66rem; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; }
  .vi-type.word { color: #3b7dd8; }
  .vi-type.phrase { color: #2f9a5a; }
  .vi-type.slang { color: #c4533a; }
  .vi-icon {
    flex: 0 0 auto; font: inherit; font-size: 0.8rem; width: 30px; height: 28px; cursor: pointer;
    border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text);
  }
  .vi-icon.del:hover { border-color: #c4533a; }
  .vi-ja { font-size: 0.86rem; margin-top: 3px; }
  .vi-note { font-size: 0.78rem; color: var(--sub); margin-top: 2px; }
  .vi-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding-top: 8px; font-size: 0.72rem; color: var(--sub); }
  .vi-foot button { font: inherit; font-size: 0.72rem; background: none; border: none; color: var(--accent-dark); cursor: pointer; padding: 2px 0; text-decoration: underline; }
  .vi-empty { font-size: 0.8rem; color: var(--sub); padding: 10px 0 2px; }
  .sync-link { text-align: center; margin-top: 28px; font-size: 0.75rem; color: var(--sub); }
  .sync-link button { font: inherit; background: none; border: none; color: var(--accent-dark); text-decoration: underline; cursor: pointer; }
</style>
</head>

<div class="wrap">

</div>

/* ---------- この曲の単語・表現（LYRIC_VOCAB は add_vocab.py が書く） ---------- */
// 削除＝非表示。キーは「曲名|歌手::英語」。合言葉があれば Firestore で端末間共有する
const LS_HIDDEN = 'lyricsLinks_hiddenVocab';
const TYPE_LABEL = { word: '単語', phrase: '表現', slang: 'スラング・口語' };
let hiddenVocab = new Set();
try { hiddenVocab = new Set(JSON.parse(localStorage.getItem(LS_HIDDEN) || '[]')); } catch (e) {}
const openVocab = new Set();

const songKey = s => s.title + '|' + s.artist;
const vocabKey = (s, it) => songKey(s) + '::' + it.en.toLowerCase();
const allVocab = s => LYRIC_VOCAB[songKey(s)] || [];
const shownVocab = s => allVocab(s).filter(it => !hiddenVocab.has(vocabKey(s, it)));

function saveHidden() {
  try { localStorage.setItem(LS_HIDDEN, JSON.stringify(Array.from(hiddenVocab))); } catch (e) {}
  vocabSyncPush();
}

// 音声は add_vocab.py が edge-tts（en-US-AndrewNeural・英単語ノートと同じ声）で作った audio_vocab/<id>.mp3。
// iOSで2回目以降も鳴るように audio 要素は1つを使い回し、src だけ差し替える
const vocabAudio = new Audio();
vocabAudio.preload = 'none';

function speakTTS(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/~/g, ' ').replace(/ \/ /g, ', '));
  u.lang = 'en-US'; u.rate = 0.9;
  speechSynthesis.speak(u);
}

function speak(it) {
  if (!it.id) return speakTTS(it.en);
  vocabAudio.pause();
  vocabAudio.onerror = () => speakTTS(it.en);  // mp3 が無い・読めないときだけ端末の読み上げ
  vocabAudio.src = 'audio_vocab/' + it.id + '.mp3';
  const p = vocabAudio.play();
  if (p && p.catch) p.catch(e => { if (e.name !== 'AbortError') speakTTS(it.en); });
}

function vocabButton(s) {
  const n = shownVocab(s).length;
  if (!allVocab(s).length) return null;
  const btn = document.createElement('button');
  const on = openVocab.has(songKey(s));
  btn.className = 'vocab-btn' + (on ? ' on' : '');
  btn.textContent = on ? '📝 単語・表現をとじる' : `📝 この曲の単語・表現を表示（${n}）`;
  btn.onclick = () => {
    if (openVocab.has(songKey(s))) openVocab.delete(songKey(s));
    else openVocab.add(songKey(s));
    renderSongs();
  };
  return btn;
}

function vocabPanel(s) {
  const panel = document.createElement('div');
  panel.className = 'vocab-panel';
  const items = shownVocab(s);
  if (!items.length) panel.innerHTML = '<div class="vi-empty">表示する単語・表現はありません</div>';
  items.forEach(it => {
    const el = document.createElement('div');
    el.className = 'vi';
    const type = TYPE_LABEL[it.type] ? it.type : 'phrase';
    el.innerHTML = `
      <div class="vi-head">
        <span class="vi-en">${escapeHtml(it.en)}</span>
        <span class="vi-type ${type}">${TYPE_LABEL[type]}</span>
        <button class="vi-icon" title="読み上げ">🔊</button>
        <button class="vi-icon del" title="削除">🗑</button>
      </div>
      <div class="vi-ja">${escapeHtml(it.ja)}</div>
      ${it.note ? `<div class="vi-note">${escapeHtml(it.note)}</div>` : ''}
    `;
    const [btnSpeak, btnDel] = el.querySelectorAll('button');
    btnSpeak.onclick = () => speak(it);
    btnDel.onclick = () => {
      hiddenVocab.add(vocabKey(s, it));
      saveHidden();
      renderSongs();
    };
    panel.appendChild(el);
  });
  const hiddenHere = allVocab(s).filter(it => hiddenVocab.has(vocabKey(s, it)));
  const foot = document.createElement('div');
  foot.className = 'vi-foot';
  foot.innerHTML = '<span>🔊 で読み上げ ／ 🗑 で削除</span>';
  if (hiddenHere.length) {
    const back = document.createElement('button');
    back.textContent = `削除した${hiddenHere.length}件を戻す`;
    back.onclick = () => {
      hiddenHere.forEach(it => hiddenVocab.delete(vocabKey(s, it)));
      saveHidden();
      renderSongs();
    };
    foot.appendChild(back);
  }
  panel.appendChild(foot);
  return panel;
}

const VOCAB_SYNC_CONFIG = {
  apiKey: "AIzaSyASWojYpZ3KJBYG9V30Y4BmplUFORYOelw",
  authDomain: "ai-english-review.firebaseapp.com",
  projectId: "ai-english-review",
  storageBucket: "ai-english-review.firebasestorage.app",
  messagingSenderId: "146537476580",
  appId: "1:146537476580:web:4ef3dfdf9c0969f25b17f1"
};
let _vocabSyncDoc = null;

function syncId() {
  let id = null;
  try { id = localStorage.getItem('aien_sync_id'); } catch (e) {}
  return (id && id !== '__none__') ? id : null;
}

function loadScript(src) {
  return new Promise((ok, ng) => {
    const el = document.createElement('script');
    el.src = src; el.onload = ok; el.onerror = ng;
    document.head.appendChild(el);
  });
}

async function initVocabSync() {
  const id = syncId();
  if (!id) return;
  try {
    const FB = 'https://www.gstatic.com/firebasejs/10.14.1/';
    if (!window.firebase) {
      await loadScript(FB + 'firebase-app-compat.js');
      await loadScript(FB + 'firebase-firestore-compat.js');
    }
    if (!firebase.apps.length) firebase.initializeApp(VOCAB_SYNC_CONFIG);
    const doc = firebase.firestore().collection('reviewLists').doc(id + '__lyrics_vocab');
    const snap = await Promise.race([
      doc.get(),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 4000))
    ]);
    _vocabSyncDoc = doc;
    if (snap.exists && Array.isArray(snap.data().hidden)) {
      hiddenVocab = new Set(snap.data().hidden);
      try { localStorage.setItem(LS_HIDDEN, JSON.stringify(Array.from(hiddenVocab))); } catch (e) {}
      renderSongs();
    } else if (hiddenVocab.size) {
      vocabSyncPush();
    }
  } catch (e) {
    console.warn('単語・表現の削除の同期に失敗しました（この端末の記録だけで動きます）', e);
  }
}

function vocabSyncPush() {
  if (!_vocabSyncDoc) return;
  _vocabSyncDoc.set({ hidden: Array.from(hiddenVocab), updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true })
    .catch(e => console.warn('削除の送信に失敗しました', e));
}

function renderSyncLabel() {
  const id = syncId();
  document.getElementById('syncLabel').textContent = id ? `共有ON（合言葉: ${id}）` : '共有OFF（この端末だけ）';
}

  if (input === null) return;
  try { localStorage.setItem('aien_sync_id', input.trim() || '__none__'); } catch (e) {}
  location.reload();
};

function allTags() {
  const set = new Set();
  SONGS.forEach(s => (s.tags || []).forEach(t => set.add(t)));
  return Array.from(set).sort();
}

  tagFiltersEl.innerHTML = '';
  allTags().forEach(tag => {
    const chip = document.createElement('div');
    chip.className = 'tag-chip' + (activeTag === tag ? ' active' : '');
    chip.textContent = tag;
    chip.onclick = () => {
      activeTag = activeTag === tag ? null : tag;
      renderTagFilters();
      renderSongs();
    };
    tagFiltersEl.appendChild(chip);
  });
}

function filteredSongs() {
  const q = searchBox.value.trim().toLowerCase();
  return SONGS.filter(s => {
    const matchesTag = !activeTag || (s.tags || []).includes(activeTag);
    const haystack = [s.title, s.artist, ...(s.tags || []), ...shownVocab(s).map(it => it.en)].join(' ').toLowerCase();
    const matchesQuery = !q || haystack.includes(q);
    return matchesTag && matchesQuery;
  });
}

function groupByArtist(songs) {
  const map = new Map();
  songs.forEach(s => {
    const key = s.artist || '(アーティスト不明)';
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(s);
  });
  return Array.from(map.entries())
    .sort((a, b) => a[0].localeCompare(b[0], 'en'));
}

function songCard(s) {
  const card = document.createElement('div');
  card.className = 'song-card';
  card.innerHTML = `
      <p class="song-title">${escapeHtml(s.title)}</p>
      <p class="song-artist">${escapeHtml(s.artist)}</p>
      <div class="song-tags">${(s.tags || []).map(t => `<span>${escapeHtml(t)}</span>`).join('')}</div>
      <div class="song-links">
        ${s.translationUrl ? `<a href="${s.translationUrl}" target="_blank" rel="noopener">📖 和訳を読む${s.translationSiteName ? `（${escapeHtml(s.translationSiteName)}）` : ''}</a>` : ''}
        ${s.youtubeUrl ? `<a href="${s.youtubeUrl}" target="_blank" rel="noopener">▶️ MV/音源</a>` : ''}
      </div>
      <div class="song-memo">${escapeHtml(s.memo || '')}</div>
    `;
  const btn = vocabButton(s);
  if (btn) {
    card.querySelector('.song-links').appendChild(btn);
    if (openVocab.has(songKey(s))) card.insertBefore(vocabPanel(s), card.querySelector('.song-memo'));
  }
  return card;
}

function songRow(s) {
  const row = document.createElement('div');
  const vOpen = openVocab.has(songKey(s)) && allVocab(s).length;
  row.className = 'song-row' + (s.memo ? ' has-memo' : '') + (vOpen ? ' vocab-open' : '');
  row.innerHTML = `
      <div class="song-row-main"><span class="song-row-title">${escapeHtml(s.title)}</span></div>
      ${s.translationUrl ? `<a href="${s.translationUrl}" target="_blank" rel="noopener" title="${escapeHtml(s.translationSiteName || '')}">📖 和訳</a>` : ''}
      ${s.youtubeUrl ? `<a href="${s.youtubeUrl}" target="_blank" rel="noopener">▶️ 動画</a>` : ''}
      ${s.memo ? `<div class="song-row-memo">${escapeHtml(s.memo)}</div>` : ''}
    `;
  const btn = vocabButton(s);
  if (btn) row.querySelector('.song-row-main').appendChild(btn);
  if (vOpen) row.appendChild(vocabPanel(s));
  return row;
}

// グループ内のYouTube動画をまとめて連続再生するリンク（watch_videosは50本まで）
function playAllUrl(songs) {
  const ids = songs
    .map(s => (s.youtubeUrl || '').match(/[?&]v=([\w-]{11})/))
    .filter(Boolean).map(m => m[1]).slice(0, 50);
  return ids.length >= 2 ? 'https://www.youtube.com/watch_videos?video_ids=' + ids.join(',') : '';
}

function renderSongs() {
  const filtered = filteredSongs();
  const searching = searchBox.value.trim() !== '';

  listEl.innerHTML = '';
  listEl.classList.toggle('by-artist', viewMode === 'artist');
  countEl.textContent = `${filtered.length} / ${SONGS.length} 曲`;
  emptyEl.style.display = filtered.length ? 'none' : 'block';

  if (viewMode === 'flat') {
    filtered.forEach(s => listEl.appendChild(songCard(s)));
    return;
  }

  groupByArtist(filtered).forEach(([artist, songs]) => {
    // 検索中は該当グループを自動で開く（探している曲がトグルに隠れないように）
    const isOpen = searching || openArtists.has(artist);

    const group = document.createElement('div');
    group.className = 'artist-group' + (isOpen ? ' open' : '');

    const head = document.createElement('div');
    head.className = 'artist-head';
    head.innerHTML = `
      <span class="chevron">▶</span>
      <span class="artist-name">${escapeHtml(artist)}</span>
      <span class="artist-count">${songs.length}曲</span>
    `;
    head.onclick = () => {
      if (openArtists.has(artist)) openArtists.delete(artist);
      else openArtists.add(artist);
      saveOpen();
      renderSongs();
    };

    const body = document.createElement('div');
    body.className = 'artist-body';
    const playUrl = playAllUrl(songs);
    if (playUrl) {
      const a = document.createElement('a');
      a.className = 'group-play';
      a.href = playUrl; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = `▶️ この${songs.length}曲をまとめて再生`;
      body.appendChild(a);
    }
    songs.forEach(s => body.appendChild(songRow(s)));

    group.appendChild(head);
    group.appendChild(body);
    listEl.appendChild(group);
  });
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

btnArtist.onclick = () => setViewMode('artist');
btnFlat.onclick = () => setViewMode('flat');
btnOpenAll.onclick = () => {
  groupByArtist(filteredSongs()).forEach(([artist]) => openArtists.add(artist));
  saveOpen();
  renderSongs();
};
btnCloseAll.onclick = () => {
  openArtists.clear();
  saveOpen();
  renderSongs();
};

searchBox.addEventListener('input', renderSongs);
renderTagFilters();
renderViewToggle();
renderSongs();
renderSyncLabel();
initVocabSync();
</script>
</body>
</html>
