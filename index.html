<html lang="ja">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歌詞和訳リンク集</title>
<style>
  :root {
    --bg: #fdfaf6;
    --card-bg: #ffffff;
    --text: #2b2620;
    --sub: #7a7266;
    --accent: #d98c3f;
    --accent-dark: #b96f24;
    --border: #ece4d8;
    --tag-bg: #f4ead9;
    --tag-text: #8a5a1f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a17;
      --card-bg: #26231f;
      --text: #f0ebe2;
      --sub: #b3a999;
      --accent: #e6a15c;
      --accent-dark: #f0b978;
      --border: #3a352c;
      --tag-bg: #3a2e1e;
      --tag-text: #e6b370;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1a17; --card-bg: #26231f; --text: #f0ebe2; --sub: #b3a999;
    --accent: #e6a15c; --accent-dark: #f0b978; --border: #3a352c;
    --tag-bg: #3a2e1e; --tag-text: #e6b370;
  }
  :root[data-theme="light"] {
    --bg: #fdfaf6; --card-bg: #ffffff; --text: #2b2620; --sub: #7a7266;
    --accent: #d98c3f; --accent-dark: #b96f24; --border: #ece4d8;
    --tag-bg: #f4ead9; --tag-text: #8a5a1f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 24px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .subtitle { color: var(--sub); font-size: 0.85rem; }
  .controls {
    display: flex; flex-direction: column; gap: 10px;
    margin-bottom: 20px; position: sticky; top: 0;
    background: var(--bg); padding: 10px 0; z-index: 10;
  }
  #searchBox {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--card-bg);
    color: var(--text); font-size: 1rem;
  }
  #searchBox:focus { outline: 2px solid var(--accent); }
  .tag-filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-chip {
    padding: 5px 12px; border-radius: 999px; font-size: 0.78rem;
    background: var(--tag-bg); color: var(--tag-text); border: 1px solid transparent;
    cursor: pointer; user-select: none;
  }
  .tag-chip.active { background: var(--accent); color: #fff; }
  .song-list { display: flex; flex-direction: column; gap: 14px; }
  .song-card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 16px; padding: 16px 18px;
  }
  .song-title { font-size: 1.1rem; font-weight: 700; margin: 0; }
  .song-artist { color: var(--sub); font-size: 0.85rem; margin: 2px 0 10px; }
  .song-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .song-tags span {
    background: var(--tag-bg); color: var(--tag-text);
    font-size: 0.72rem; padding: 3px 10px; border-radius: 999px;
  }
  .song-links { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .song-links a {
    text-decoration: none; font-size: 0.85rem; padding: 7px 14px;
    border-radius: 10px; border: 1px solid var(--accent); color: var(--accent-dark);
  }
  .song-links a:hover { background: var(--tag-bg); }
  .song-memo {
    font-size: 0.85rem; color: var(--text); background: var(--bg);
    border-radius: 10px; padding: 8px 12px; white-space: pre-wrap;
    border: 1px dashed var(--border);
  }
  .song-memo:empty { display: none; }
  .view-toggle { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .view-btn {
    padding: 6px 14px; border-radius: 999px; font-size: 0.78rem; cursor: pointer;
    background: var(--card-bg); color: var(--sub);
    border: 1px solid var(--border); user-select: none;
  }
  .view-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .view-btn.ghost { border-style: dashed; }
  .artist-group {
    border: 1px solid var(--border); border-radius: 16px;
    background: var(--card-bg); overflow: hidden;
  }
  .artist-head {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px; cursor: pointer; user-select: none;
  }
  .artist-head:hover { background: var(--tag-bg); }
  .artist-name { font-weight: 700; font-size: 1rem; flex: 1; }
  .artist-count {
    font-size: 0.72rem; color: var(--tag-text); background: var(--tag-bg);
    padding: 3px 10px; border-radius: 999px;
  }
  .chevron { color: var(--sub); font-size: 0.8rem; transition: transform .15s; }
  .artist-group.open .chevron { transform: rotate(90deg); }
  .artist-body { display: none; padding: 0 12px 12px; flex-direction: column; gap: 10px; }
  .artist-group.open .artist-body { display: flex; }
  .artist-body .song-card { border-radius: 12px; background: var(--bg); }
  .empty-state { text-align: center; color: var(--sub); padding: 40px 0; }
  .count { text-align: center; color: var(--sub); font-size: 0.78rem; margin-bottom: 6px; }
</style>
</head>

    </div>
    <div class="tag-filters" id="tagFilters"></div>

</div>

const listEl = document.getElementById('songList');
const emptyEl = document.getElementById('emptyState');
const countEl = document.getElementById('countLabel');
const searchBox = document.getElementById('searchBox');
const tagFiltersEl = document.getElementById('tagFilters');
const btnArtist = document.getElementById('btnArtist');
const btnFlat = document.getElementById('btnFlat');
const btnOpenAll = document.getElementById('btnOpenAll');
const btnCloseAll = document.getElementById('btnCloseAll');

const LS_VIEW = 'lyricsLinks_viewMode';
const LS_OPEN = 'lyricsLinks_openArtists';

let activeTag = null;
let viewMode = localStorage.getItem(LS_VIEW) === 'flat' ? 'flat' : 'artist';
let openArtists = new Set();
try { openArtists = new Set(JSON.parse(localStorage.getItem(LS_OPEN) || '[]')); } catch (e) {}

function saveOpen() {
  localStorage.setItem(LS_OPEN, JSON.stringify(Array.from(openArtists)));
}

function allTags() {
  const set = new Set();
  SONGS.forEach(s => (s.tags || []).forEach(t => set.add(t)));
  return Array.from(set).sort();
}

function renderTagFilters() {
  tagFiltersEl.innerHTML = '';
  allTags().forEach(tag => {
    const chip = document.createElement('div');
    chip.className = 'tag-chip' + (activeTag === tag ? ' active' : '');
    chip.textContent = tag;
    chip.onclick = () => {
      activeTag = activeTag === tag ? null : tag;
      renderTagFilters();
      renderSongs();
    };
    tagFiltersEl.appendChild(chip);
  });
}

function renderViewToggle() {
  btnArtist.classList.toggle('active', viewMode === 'artist');
  btnFlat.classList.toggle('active', viewMode === 'flat');
  const showBulk = viewMode === 'artist';
  btnOpenAll.style.display = showBulk ? '' : 'none';
  btnCloseAll.style.display = showBulk ? '' : 'none';
}

function setViewMode(mode) {
  viewMode = mode;
  localStorage.setItem(LS_VIEW, mode);
  renderViewToggle();
  renderSongs();
}

function filteredSongs() {
  const q = searchBox.value.trim().toLowerCase();
  return SONGS.filter(s => {
    const matchesTag = !activeTag || (s.tags || []).includes(activeTag);
    const haystack = [s.title, s.artist, ...(s.tags || [])].join(' ').toLowerCase();
    const matchesQuery = !q || haystack.includes(q);
    return matchesTag && matchesQuery;
  });
}

function groupByArtist(songs) {
  const map = new Map();
  songs.forEach(s => {
    const key = s.artist || '(アーティスト不明)';
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(s);
  });
  return Array.from(map.entries())
    .sort((a, b) => a[0].localeCompare(b[0], 'en'));
}

function songCard(s) {
  const card = document.createElement('div');
  card.className = 'song-card';
  card.innerHTML = `
      <p class="song-title">${escapeHtml(s.title)}</p>
      <p class="song-artist">${escapeHtml(s.artist)}</p>
      <div class="song-tags">${(s.tags || []).map(t => `<span>${escapeHtml(t)}</span>`).join('')}</div>
      <div class="song-links">
        ${s.translationUrl ? `<a href="${s.translationUrl}" target="_blank" rel="noopener">📖 和訳を読む${s.translationSiteName ? `（${escapeHtml(s.translationSiteName)}）` : ''}</a>` : ''}
        ${s.youtubeUrl ? `<a href="${s.youtubeUrl}" target="_blank" rel="noopener">▶️ MV/音源</a>` : ''}
      </div>
      <div class="song-memo">${escapeHtml(s.memo || '')}</div>
    `;
  return card;
}

function renderSongs() {
  const filtered = filteredSongs();
  const searching = searchBox.value.trim() !== '';

  listEl.innerHTML = '';
  countEl.textContent = `${filtered.length} / ${SONGS.length} 曲`;
  emptyEl.style.display = filtered.length ? 'none' : 'block';

  if (viewMode === 'flat') {
    filtered.forEach(s => listEl.appendChild(songCard(s)));
    return;
  }

  groupByArtist(filtered).forEach(([artist, songs]) => {
    // 検索中は該当グループを自動で開く（探している曲がトグルに隠れないように）
    const isOpen = searching || openArtists.has(artist);

    const group = document.createElement('div');
    group.className = 'artist-group' + (isOpen ? ' open' : '');

    const head = document.createElement('div');
    head.className = 'artist-head';
    head.innerHTML = `
      <span class="chevron">▶</span>
      <span class="artist-name">${escapeHtml(artist)}</span>
      <span class="artist-count">${songs.length}曲</span>
    `;
    head.onclick = () => {
      if (openArtists.has(artist)) openArtists.delete(artist);
      else openArtists.add(artist);
      saveOpen();
      renderSongs();
    };

    const body = document.createElement('div');
    body.className = 'artist-body';
    songs.forEach(s => body.appendChild(songCard(s)));

    group.appendChild(head);
    group.appendChild(body);
    listEl.appendChild(group);
  });
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

btnArtist.onclick = () => setViewMode('artist');
btnFlat.onclick = () => setViewMode('flat');
btnOpenAll.onclick = () => {
  groupByArtist(filteredSongs()).forEach(([artist]) => openArtists.add(artist));
  saveOpen();
  renderSongs();
};
btnCloseAll.onclick = () => {
  openArtists.clear();
  saveOpen();
  renderSongs();
};

searchBox.addEventListener('input', renderSongs);
renderTagFilters();
renderViewToggle();
renderSongs();
</script>
